<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ✅ Viewport (already had this — essential for mobile) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ✅ Page title (shows in browser tab & search results) -->
    <title>AgriConnect — Smart Agriculture</title>

    <!-- ✅ Description (SEO + link previews) -->
    <meta
      name="description"
      content="AgriConnect — manage your farms, crops, and agricultural activities from one place."
    />

    <!-- ✅ Mobile browser theme color (colors the address bar on Android) -->
    <meta name="theme-color" content="#16a34a" />

    <!-- ✅ Better mobile web app feel (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AgriConnect" />

    <!-- ✅ Open Graph (link previews on WhatsApp, Facebook, etc.) -->
    <meta property="og:title" content="AgriConnect — Smart Agriculture" />
    <meta
      property="og:description"
      content="Manage your farms, crops, and agricultural activities from one place."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
